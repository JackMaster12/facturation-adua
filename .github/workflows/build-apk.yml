name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ranger les fichiers dans leurs dossiers
        run: |
          for f in *__*; do
            [ -f "$f" ] || continue
            d=$(echo "$f" | sed 's/__/\//g')
            mkdir -p "$(dirname "$d")"
            mv "$f" "$d"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer la partie Android
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.adua --project-name facturation_adua
          fi
          rm -f test/widget_test.dart
      - name: Version minimale d'Android requise par Firebase
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i 's/flutter\.minSdkVersion/23/' "$f"
          done
          true
      - name: Clé de signature fixe (permet les mises à jour sans désinstaller)
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - name: Publier l'APK dans une Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk facturation-adua-arm64.apk
          cp app-armeabi-v7a-release.apk facturation-adua-arm32.apk
          gh release create "v0.2.${{ github.run_number }}" \
            facturation-adua-arm64.apk facturation-adua-arm32.apk \
            --repo "${{ github.repository }}" \
            --title "Version 0.2.${{ github.run_number }}" \
            --notes "APK Android. Samsung A03 Core : installer facturation-adua-arm32.apk."

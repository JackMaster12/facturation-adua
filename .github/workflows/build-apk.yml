name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ranger les fichiers dans leurs dossiers
        run: |
          for f in *__*; do
            [ -f "$f" ] || continue
            d=$(echo "$f" | sed 's/__/\//g')
            mkdir -p "$(dirname "$d")"
            mv "$f" "$d"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer la partie Android
        run: |
          if [ ! -d android ]; then
          flutter create . --platforms=android --org com.adua --project-name facturation_adua
          fi
          rm -f test/widget_test.dart
      - name: Version minimale d'Android requise par Firebase
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i 's/flutter\.minSdkVersion/23/' "$f"
          done
          true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: facturation-adua-apk
          path: build/app/outputs/flutter-apk/app-release.apk
